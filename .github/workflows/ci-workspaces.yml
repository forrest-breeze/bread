# CI for everything Turbo manages: apps/*, apps/web/{app,site}, packages/*.
#
# Lint only, for packages affected since the base commit (turbo --affected):
# the PR's base branch, or the previous tip of main on push. If the base cannot
# be resolved (first push of a branch, force push) every package is linted.
#
# Conventions for every workflow in this directory: .github/workflows/README.md
name: "CI: workspaces"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-workspaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (affected packages)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Turbo can diff against the base commit.
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspaces

      - name: Resolve the Turbo base commit
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "TURBO_SCM_BASE=${base}" >> "$GITHUB_ENV"
            echo "args=--affected" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Base ${base} is not reachable; linting every package."
          fi

      - name: Lint
        run: npx turbo run lint ${{ steps.base.outputs.args }}
