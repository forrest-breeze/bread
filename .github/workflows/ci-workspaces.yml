# CI for everything Turbo manages: apps/*, apps/web/{app,site}, packages/*.
#
# Lint, typecheck and build run only for packages affected since the base
# commit (turbo --affected): the PR's base branch, or the previous tip of main
# on push. Turbo follows the dependency graph, so a change in packages/core
# rebuilds the app and site that consume it, and root-level changes (lockfile,
# turbo.json) affect every package. If the base cannot be resolved (first push
# of a branch, force push) everything runs.
#
# Conventions for every workflow in this directory: .github/workflows/README.md
name: "CI: workspaces"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-workspaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint, typecheck, build (affected packages)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Turbo can diff against the base commit.
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspaces

      - name: Resolve the Turbo base commit
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "TURBO_SCM_BASE=${base}" >> "$GITHUB_ENV"
            echo "args=--affected" >> "$GITHUB_OUTPUT"
            echo "Packages affected since ${base}:"
            TURBO_SCM_BASE="${base}" npx turbo ls --affected
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Base ${base} is not reachable; running every package."
          fi

      - name: Validate Bread docs front matter
        run: npm run validate:bread-docs

      - name: Cache Next.js builds
        uses: actions/cache@v4
        with:
          path: |
            apps/web/app/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/app/src/**', 'packages/*/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Lint, typecheck, build
        run: npx turbo run lint typecheck build ${{ steps.base.outputs.args }}

      - name: Check API route input validation (apps/web/app)
        working-directory: apps/web/app
        run: node scripts/check-route-validation.mjs

  test:
    name: Unit tests + coverage (all workspaces)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspaces

      # The root coverage runner executes every testable workspace, writes
      # per-workspace coverage, then aggregates the repo totals under coverage/.
      # It runs the whole graph (not --affected) so the repo summary stays whole.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Add coverage to job summary
        if: ${{ always() && hashFiles('coverage/repo-summary.md') != '' }}
        run: cat coverage/repo-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('coverage/repo-summary.md') != '' }}
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require("fs")

            const marker = "<!-- bread-coverage-summary -->"
            const summary = fs.readFileSync("coverage/repo-summary.md", "utf8").trim()
            const body = `${marker}\n${summary}`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })

            const previous = comments.find(
              (comment) => comment.user.type === "Bot" && comment.body?.includes(marker),
            )

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/**"
          if-no-files-found: ignore
          retention-days: 14
